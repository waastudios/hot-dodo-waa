name: IPTV GitHub Publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action: hunt, hunttxt, or scrape"
        required: true
        default: "hunt"
        type: choice
        options:
          - hunt
          - hunttxt
          - scrape
      keyword:
        description: "Optional channel keyword"
        required: false
        default: ""
        type: string
      count:
        description: "Number of results"
        required: true
        default: "5"
        type: string

concurrency:
  group: iptv-github-publisher
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests aiohttp pyrogram tgcrypto

      - name: Run GitHub Publisher
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          MY_SESSION_STRING: ${{ secrets.MY_SESSION_STRING }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          KEYWORD: ${{ inputs.keyword }}
          COUNT: ${{ inputs.count }}
        run: python worker.py
